<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Cinema - SI48</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-1 fw-bold text-gradient"> GALAXY MOVIE EXPLORER</h1>
        <p class="text-center text-secondary mb-5">Jelajahi ribuan film di seluruh galaksi!</p>
        
        <div class="row justify-content-center mb-5">
            <div class="col-md-9">
                <div class="search-container shadow-lg">
                    <select id="typeFilter" class="filter-select">
                        <option value="">Semua</option>
                        <option value="movie">Movie</option>
                        <option value="series">Series</option>
                    </select>
                    <input type="text" id="searchInput" class="search-input" 
                           placeholder="Ketik judul film disini..." 
                           onkeypress="handleKeyPress(event)">
                    <button class="btn-search" onclick="searchMovies()">Cari</button>
                </div>
            </div>
        </div>

        <div id="movieResults" class="row g-4"></div>
    </div>

    <div class="modal fade" id="movieDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content galaxy-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold text-white" id="modalTitle">Detail Film</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-white" id="modalBody">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
